# https://taskfile.dev

version: '3'

vars:
  BINARY_FOLDER: bin
  BINARY_NAME: pleco
  GOLANGCI_LINT_VERSION: v1.46.2

dotenv: ['.env']

tasks:
  build:
    desc: Build pleco binary
    cmds:
      - go build -v -o {{.BINARY_FOLDER}}/{{.BINARY_NAME}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY_FOLDER}}/{{.BINARY_NAME}}'

  test:
    desc: Run acceptance tests
    cmds:
      - go test -v -cover ./... {{.CLI_ARGS}}

  lint:
    desc: Run linters
    deps:
      - install-golangci-lint
    cmds:
      - golangci-lint run ./...
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - .golangci.yml

  release:bump:
    desc: "Push a branch setting the next version (default: patch bump of the latest tag), to merge through an MR. Args: -- [X.Y.Z] [--yes] [--dry-run]"
    interactive: true
    cmds:
      - bash scripts/release.sh bump {{.CLI_ARGS}}

  release:
    desc: "Tag main with its merged version and push the tag: builds the image, deploys the test clusters. Args: -- [--yes] [--dry-run]"
    interactive: true
    cmds:
      - bash scripts/release.sh tag {{.CLI_ARGS}}

  install-golangci-lint:
    desc: Install the golangci-lint tool
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - which golangci-lint
      - golangci-lint version | grep {{.GOLANGCI_LINT_VERSION}}
